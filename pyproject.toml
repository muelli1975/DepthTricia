[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depthtricia"
version = "1.0"
requires-python = ">=3.12"
description = "Local depth-map-based 2D-to-stereo-3D image conversion"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depthtricia = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
