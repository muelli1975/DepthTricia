name: Release DepthTricia 1.0
on:
  workflow_run:
    workflows: [Source checks, Windows development build]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows build run ID
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: depthtricia-release-draft
  cancel-in-progress: false
jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      REQUESTED_RUN: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Find matching verified Windows build
        id: build
        run: |
          if [ -n "$REQUESTED_RUN" ]; then
            release_run_id="$REQUESTED_RUN"
          else
            current_source=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
            if [ "$SOURCE_SHA" != "$current_source" ]; then
              echo 'A newer source revision exists; keep its release preparation.'
              exit 0
            fi
            release_run_id=$(gh api "repos/$REPO/actions/runs?head_sha=$SOURCE_SHA&per_page=100" --jq '.workflow_runs[] | select(.name == "Windows development build" and .conclusion == "success") | .id' | head -n 1)
          fi
          if [ -z "$release_run_id" ]; then
            echo 'No completed Windows build for this source revision yet.'
            exit 0
          fi
          gh api "repos/$REPO/actions/runs/$release_run_id" > build-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('build-run.json'))
          assert run['name'] == 'Windows development build'
          assert run['conclusion'] == 'success' and run['head_branch'] == 'main'
          assert run['repository']['full_name'] == os.environ['REPO']
          if os.environ['SOURCE_SHA']:
              assert run['head_sha'] == os.environ['SOURCE_SHA']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"run_id={run['id']}\nsource_sha={run['head_sha']}\n")
          PY
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.run_id != ''
        with:
          name: DepthTricia-development
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: payload
      - name: Verify release files and smoke report
        if: steps.build.outputs.run_id != ''
        env:
          VERIFIED_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path('payload')
          report = json.loads((root / 'smoke-test.json').read_text())
          for key in ['ok', 'gui', 'presets', 'depthpro_weights', 'depthpro_native', 'preset_model_device', 'depth_png', 'original_size', 'model_filename', 'da2_inference', 'stereo_inpainting', 'metadata', 'cache', 'offline', 'window_backshift', 'cross_view']:
              assert report[key] is True, key
          assert report['inference_device'] == 'cpu' and report['cuda_runtime'] == '12.8'
          with zipfile.ZipFile(root / 'DepthTricia_1.0.zip') as package:
              manifest = json.loads(package.read('DepthTricia/runtime_manifest.json'))
              info = json.loads(package.read('DepthTricia/BUILD_INFO.json'))
          assert info['source_commit'] == os.environ['VERIFIED_SHA']
          expected = {'DepthTricia_1.0.zip'} | {item['filename'] for item in manifest['archives']}
          assert {p.name for p in root.glob('*.zip')} == expected
          for name in expected:
              assert (root / name).stat().st_size < 2**31, name
          for item in manifest['archives']:
              path = root / item['filename']
              assert path.stat().st_size == item['size']
              value = hashlib.sha256()
              with path.open('rb') as source:
                  for block in iter(lambda: source.read(4 * 1024 * 1024), b''):
                      value.update(block)
              assert value.hexdigest() == item['sha256'], path.name
          print('All release assets match the verified Windows build.')
          PY
      - name: Check matching source checks
        if: steps.build.outputs.run_id != ''
        env:
          VERIFIED_SHA: ${{ steps.build.outputs.source_sha }}
        run: |
          gh api "repos/$REPO/actions/runs?head_sha=$VERIFIED_SHA&per_page=100" > source-runs.json
          python - <<'PY'
          import json
          runs = json.load(open('source-runs.json'))['workflow_runs']
          assert any(r['name'] == 'Source checks' and r['conclusion'] == 'success' for r in runs)
          PY
      - name: Stage, download-verify and replace the current release
        if: steps.build.outputs.run_id != ''
        env:
          UPDATE_SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
        run: python scripts/publish_update.py --root payload --config .github/cross-update.json
