name: Stop superseded model test
on:
  push:
    branches: [test/zipdepth-moge3]
jobs:
  stop:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Stop the superseded Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_state=$(gh api repos/muelli1975/DepthTricia/actions/runs/44876003386 --jq .status)
          if [ "$run_state" != "completed" ]; then
            gh api --method POST repos/muelli1975/DepthTricia/actions/runs/44876003386/cancel
          fi
