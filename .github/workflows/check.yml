name: Source checks
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 Pillow==11.3.0 pillow-heif==1.1.1 pytest==8.4.2
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q
