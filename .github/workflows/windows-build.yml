name: Windows development build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      torch_backend:
        description: PyTorch runtime
        type: choice
        options: [cu126, cpu]
        default: cu126
      bundle_da3:
        description: Try to bundle DA3 in the main ZIP
        type: boolean
        default: true
jobs:
  build:
    runs-on: windows-latest
    env:
      TORCH_BACKEND: ${{ inputs.torch_backend || 'cu126' }}
      BUNDLE_DA3: ${{ github.event_name == 'push' || inputs.bundle_da3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url "https://download.pytorch.org/whl/$env:TORCH_BACKEND"
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.4.2
      - name: Check preset editor and responsive layout
        run: python scripts/check_gui.py
      - run: python scripts/prepare_runtime.py
      - run: python scripts/prepare_tools.py
      - run: python -m pytest -q
      - name: Prepare models
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/download_models.py da2 da3 depthpro --confirm }
          else { python scripts/download_models.py da2 depthpro --confirm }
      - run: python -m PyInstaller --noconfirm --clean DepthTricia.spec
      - name: Prepare portable folder
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/package_release.py --prepare-only }
          else { python scripts/package_release.py --prepare-only --without-da3 }
      - name: Verify packaged executable on CPU
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'dist/smoke-test.json'
          $process = Start-Process dist/DepthTricia/DepthTricia.exe -ArgumentList @('--smoke-test', $report) -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged executable smoke test failed.' }
      - run: python scripts/package_release.py --archive-only
      - uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-development
          path: |
            dist/DepthTricia_1.0.zip
            dist/DepthTricia_Runtime_*.zip
            dist/DepthTricia_Models_*.zip
            dist/smoke-test.json
          compression-level: 0
          retention-days: 7
      - name: Save diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-diagnostics
          path: |
            dist/smoke-test.json
            dist/DepthTricia/depthtricia_error.log
            build/DepthTricia/warn-DepthTricia.txt
          if-no-files-found: ignore
