name: Windows development build
on:
  push:
    branches: ['test/zipdepth-moge3']
  workflow_dispatch:
    inputs:
      torch_backend:
        description: PyTorch runtime
        type: choice
        options: [cu128, cpu]
        default: cu128
      bundle_da3:
        description: Try to bundle DA3 in the main ZIP
        type: boolean
        default: true
jobs:
  build:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Refresh DepthTricia 1.0 title bars'
    runs-on: windows-latest
    env:
      TORCH_BACKEND: ${{ inputs.torch_backend || 'cu128' }}
      BUNDLE_DA3: ${{ github.event_name == 'push' || inputs.bundle_da3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url "https://download.pytorch.org/whl/$env:TORCH_BACKEND"
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.4.2 matplotlib==3.10.7 triton-windows==3.6.0.post26
          python -m pip install "git+https://github.com/EasternJournalist/utils3d-moge@62f09d58509485564e24d5d9f6aac9ee9ebc0c37" "git+https://github.com/JeffreyXiang/FlexGEMM@b2fadb29d41846c7981ade6801ffc689fae119cf"
      - name: Check preset editor and responsive layout
        run: python scripts/check_gui.py
      - name: Save layout screenshots
        uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-layout
          path: build/gui-check/*.png
          retention-days: 7
      - run: python scripts/prepare_runtime.py
      - run: python scripts/prepare_tools.py
      - run: python -m pytest -q
      - name: Prepare models
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/download_models.py da2 da3 depthpro zipdepth moge3 --confirm }
          else { python scripts/download_models.py da2 depthpro zipdepth moge3 --confirm }
      - run: python -m PyInstaller --noconfirm --clean DepthTricia.spec
      - name: Prepare portable folder
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/package_release.py --prepare-only }
          else { python scripts/package_release.py --prepare-only --without-da3 }
      - name: Verify packaged executable on CPU
        shell: pwsh
        run: |
          $report = Join-Path (Get-Location) 'dist/smoke-test.json'
          $process = Start-Process dist/DepthTricia/DepthTricia.exe -ArgumentList @('--smoke-test', $report) -WindowStyle Hidden -Wait -PassThru
          if (Test-Path $report) { Get-Content $report }
          if ($process.ExitCode -ne 0 -or !(Test-Path $report)) { throw 'Packaged executable smoke test failed.' }
      - run: python scripts/package_release.py --archive-only
      - uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-Windows-Test-ZipDepth-MoGe3
          path: |
            dist/DepthTricia_1.0.zip
            dist/DepthTricia_Runtime_*.zip
            dist/DepthTricia_Models_*.zip
            dist/smoke-test.json
          compression-level: 0
          retention-days: 7
      - name: Save diagnostic report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-diagnostics
          path: |
            dist/smoke-test.json
            dist/DepthTricia/depthtricia_error.log
            build/DepthTricia/warn-DepthTricia.txt
          if-no-files-found: ignore

