name: Windows development build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      torch_backend:
        description: PyTorch runtime
        type: choice
        options: [cu126, cpu]
        default: cu126
      bundle_da3:
        description: Try to bundle DA3 in the main ZIP
        type: boolean
        default: true
jobs:
  build:
    runs-on: windows-latest
    env:
      TORCH_BACKEND: ${{ inputs.torch_backend || 'cu126' }}
      BUNDLE_DA3: ${{ github.event_name == 'push' || inputs.bundle_da3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url "https://download.pytorch.org/whl/$env:TORCH_BACKEND"
          python -m pip install -r requirements.txt pyinstaller==6.16.0 pytest==8.4.2
      - run: python scripts/prepare_runtime.py
      - run: python scripts/prepare_tools.py
      - run: python -m pytest -q
      - name: Prepare models
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/download_models.py da2 da3 --confirm }
          else { python scripts/download_models.py da2 --confirm }
      - run: python -m PyInstaller --noconfirm --clean DepthTricia.spec
      - name: Package
        shell: pwsh
        run: |
          if ($env:BUNDLE_DA3 -eq 'true') { python scripts/package_release.py }
          else { python scripts/package_release.py --without-da3 }
      - uses: actions/upload-artifact@v4
        with:
          name: DepthTricia-development
          path: dist/DepthTricia_1.0.zip
          compression-level: 0
